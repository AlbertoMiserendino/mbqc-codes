<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Explore measurement-based quantum computing through bilingual notebooks on teleportation, single-qubit rotation and the CNOT gate.">
  <title>Measurement-based quantum computing</title>
  <style>
    :root {
      color-scheme: light;
      --cyan: #64cddd;
      --aqua: #a5dad4;
      --cream: #e1e4cb;
      --orange: #fa882e;
      --bright-orange: #ff6900;
      --bg: #fffefa;
      --panel: #ffffff;
      --ink: #203b3d;
      --muted: #486163;
      --line: #e0eae6;
      --accent: #216571;
      --heading-bg: #f5f6ec;
      --nav-bg: #eef9f6;
      --hover: #974000;
    }

    body::before {
      content: "";
      display: block;
      height: 6px;
      background: linear-gradient(to right, var(--cyan) 0% 20%, var(--aqua) 20% 40%, var(--cream) 40% 60%, var(--orange) 60% 80%, var(--bright-orange) 80% 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 1rem/1.65 system-ui, sans-serif;
    }

    main {
      max-width: 1080px;
      margin: auto;
      padding: 72px 24px 40px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .repository-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-weight: 600;
      text-decoration: none;
    }

    .repository-link:hover {
      background: var(--nav-bg);
    }

    .repository-link svg {
      flex-shrink: 0;
      fill: currentColor;
    }

    .eyebrow {
      color: var(--accent);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 850px;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      line-height: 1.12;
      letter-spacing: -.04em;
      margin: 16px 0 24px;
    }

    .intro {
      max-width: 740px;
      font-size: 1.15rem;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 40px 0;
    }

    article {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 26px;
      display: flex;
      flex-direction: column;
    }

    .number {
      color: var(--accent);
      font: 700 .9rem/1.5 ui-monospace, monospace;
    }

    h2 {
      font-size: 1.35rem;
      line-height: 1.3;
      margin: 18px 0 8px;
    }

    article p {
      color: var(--muted);
      margin: 8px 0 24px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
    }

    a {
      color: var(--accent);
      text-underline-offset: 3px;
    }

    .links a {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .links a:hover {
      background: var(--bg);
      text-decoration: underline;
    }

    a:hover {
      color: var(--hover);
    }

    pre {
      border-left: 4px solid var(--cyan);
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: .9rem;
    }

    footer p {
      max-width: 780px;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }

      main {
        padding-top: 40px;
      }
    }

    html {
      scroll-behavior: smooth;
    }

    h2 {
      margin-top: 48px;
      padding-top: 12px;
      border-top: 1px solid #f7d8bb;
      font-size: 1.7rem;
    }

    h3 {
      margin-top: 28px;
      font-size: 1.2rem;
    }

    h1,
    h2,
    h3 {
      scroll-margin-top: 24px;
    }

    p,
    li {
      max-width: 900px;
    }

    pre {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
    }

    code {
      font-family: ui-monospace, monospace;
      font-size: .9em;
      overflow-wrap: anywhere;
    }

    pre code {
      overflow-wrap: normal;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 20px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
    }

    th,
    td {
      text-align: left;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      min-width: 140px;
    }

    th {
      font-weight: 700;
      background: var(--heading-bg);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    blockquote {
      margin: 24px 0;
      padding: 4px 24px;
      border-left: 4px solid var(--bright-orange);
      color: var(--muted);
    }

    .contents {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin: 24px 0 40px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--nav-bg);
    }

    .skip-link {
      position: absolute;
      left: 24px;
      top: -100px;
      background: var(--panel);
      padding: 12px;
    }

    .skip-link:focus {
      top: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#code">Skip to the code</a>
  <main id="main-content">
    <header class="page-header">

{{CONTENT}}
  </main>
</body>
</html>
