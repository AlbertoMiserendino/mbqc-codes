name: Publish website
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/website/**
      - scripts/export-notebooks/**
      - notebooks/**
      - requirements*.txt
      - pyproject.toml
      - uv.lock
      - .python-version
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Publish committed exports; set to 'true' to restore CI regeneration.
      REGENERATE_NOTEBOOK_EXPORTS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        if: env.REGENERATE_NOTEBOOK_EXPORTS == 'true'
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install website tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install export tools
        if: env.REGENERATE_NOTEBOOK_EXPORTS == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic
          uv sync --locked
      - name: Regenerate notebook HTML and PDF
        if: env.REGENERATE_NOTEBOOK_EXPORTS == 'true'
        shell: bash
        run: bash scripts/export-notebooks/export-notebooks.sh
      - run: python3 scripts/website/build.py --stage
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
