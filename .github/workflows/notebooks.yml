name: Validate notebooks
on:
  push:
    paths:
      - '**/*.ipynb'
      - requirements*.txt
      - .python-version
  pull_request:
    paths:
      - '**/*.ipynb'
      - requirements*.txt
      - .python-version
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -c tests/pytest.ini --junitxml=build/validation/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-validation
          path: build/validation/
